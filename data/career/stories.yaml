- id: fidelity-capability
  slug: scaling-cloud-capability-at-fidelity
  title: Teaching an enterprise to build differently
  subtitle: Scaling cloud and engineering capability at Fidelity
  chapter: scaling-capability
  environment: >-
    Fidelity between 2016 and 2020: a global asset manager with a digital
    transformation strategy on paper, deep on-premise habits in practice, and cloud
    experience concentrated in a handful of enthusiasts.
  constraint: >-
    The strategy assumed thousands of engineers could design event-driven,
    cloud-native systems. They could not, yet. Sending people to certification courses
    produced badges, not systems, and every project team relearned the same lessons at
    full price.
  intervention: >-
    I stopped treating capability as a training problem and treated it as an
    engineering problem. In APS we codified reusable infrastructure as code so
    projects inherited a working foundation, and ran live-coding workshops where
    engineers built real serverless systems in the room. In Personal Investing I
    scaled the idea into a learning dojo: self-contained katas using dynamic reference
    architectures, each one walking through a full solution including its pipeline,
    designed so teams in different global locations could upskill concurrently.
    Alongside it, my team built the event-driven platform those skills would be used
    on, and I ran Event Storming sessions so the business defined the domain
    boundaries with us.
  result: >-
    Tentative AWS experiments became a multi-year cloud strategy with live cloud-native
    applications. The dojo was adopted by multiple teams across global sites. Reusable
    infrastructure cut the cost and time of every subsequent project, and the
    event-driven platform became the backbone of the digital experience ecosystem.
  learned: >-
    Capability scales when it ships as a product: versioned, self-service, opinionated
    and tested. A reference architecture someone can run teaches more than a slide
    deck someone must believe.
  reappeared: >-
    The dojo pattern became HUB's Engineering Enablement Platform and
    centre-of-excellence model, and it is now re-emerging in Hekton as the onboarding
    pattern for teams that include agents. Enablement as a product turned out to be a
    career-long thesis, not a Fidelity tactic.
  evidence:
    - label: Role detail, Director of Software Architecture, APS
    - label: Role detail, Director of Architecture, Personal Investing
  capabilities: [developer-enablement, platform-engineering, architecture, tech-strategy]

- id: hub-company-building
  slug: building-hub
  title: Employee number eight
  subtitle: Building the platform, teams and technical foundations of HUB
  chapter: building-companies
  environment: >-
    A fintech startup in January 2021: a product vision for regulated
    financial-services clients, a CTO, seven other employees, and no platform, no
    engineering organisation and no security posture.
  constraint: >-
    Everything had to exist at once, and every choice was permanent in the way early
    choices are. The product needed a platform; the platform needed engineers; the
    engineers needed standards, environments and a hiring pipeline; and regulated
    clients needed evidence they could trust all of it. One person had to sequence
    that without the luxuries of an enterprise behind them.
  intervention: >-
    I joined as the first technical hire alongside the CTO and treated the company
    itself as the system to design. Platform first: foundational architecture on
    Azure, fully automated environments in ARM, Bicep and Terraform through Azure
    DevOps, and a security posture with SOC monitoring from the start. Organisation in
    the same motion: hiring process, resource plans and autonomous team structures,
    kept coherent by a tech radar, architecture principles and development standards.
    In May 2022 I became Managing Director and Head of Cloud Engineering: owning the
    technology and cloud roadmap,
    partnering with product, compliance and executive leadership, leading SOC 2 Type I
    readiness, standing up an Engineering Enablement Platform and centre of
    excellence, and later exploring Azure OpenAI and retrieval-augmented generation
    for the product.
  result: >-
    The engineering organisation grew from one technologist to more than sixty
    engineers across Ireland, the UK and India inside a roughly seventy-person
    company. Cloud running costs came down by approximately 40 percent. Environments
    were automated from the first commit, so adding one became a pipeline run rather
    than a project, and provisioning got approximately 80 percent faster. SOC 2 Type I
    readiness gave regulated clients the evidence they needed.
  learned: >-
    Company building is system design with people in the loop. Architecture, hiring,
    security, budgets and client trust are one design problem, and the platform
    decisions and organisational decisions have to be made together or they fight
    each other later.
  reappeared: >-
    The executive range built at HUB, spanning technology, organisation and business,
    is the foundation of the Vanguard Europe role, where the same convergence plays
    out at global-firm scale. And HUB's lesson that governance must be built in from
    the first commit became Hekton's invisible-governance research thread.
  evidence:
    - label: Role detail, HUB
  capabilities: [org-design, platform-engineering, governance-risk, business-product, architecture]

- id: vanguard-europe
  slug: shaping-vanguard-europe
  title: Designing the environment, not just the system
  subtitle: Architecture and the Chief Technology Office at Vanguard Europe
  chapter: shaping-the-organisation
  environment: >-
    Vanguard's European business: UK Personal Investing and European Financial
    Adviser Services, regulated locally and built on the platforms of a global asset
    manager. I joined as Head of Architecture in October 2024 and now lead
    European Architecture and the Chief Technology Office: four teams, 22 people. The Chief
    Technology Office is a function rather than an officer, a distinction best made
    early, before anyone updates a slide.
  constraint: >-
    Nothing at this scale fails for lack of technology. It fails when sensible
    decisions made in different rooms add up to a system nobody would have designed
    on purpose: a European requirement the global roadmap has not reached yet, a
    standard nobody can find, a platform choice that is right globally and awkward
    locally. Regulation raises the stakes, because every gap between strategy and
    execution is a risk as well as a cost.
  intervention: |-
    Earlier in my career the unit of design was an application, then a platform,
    then a company. Here it is the environment in which other people make design
    decisions. I do not own Vanguard's global platforms or its investment decisions,
    so the work is connective rather than commanding:

    - **Strategy to execution.** Working with the European CIO, business and product leadership so priorities reach engineering as decisions teams can act on.
    - **Europe and global.** Representing European requirements in global platform strategy, and bringing back what can be built on rather than built around.
    - **Better decisions.** Making architecture decisions explicit, recorded and revisitable, so quality does not depend on who was in the meeting.
    - **Autonomy and consistency.** Standards and governance light enough that teams use them, and firm enough that the estate still makes sense in five years.
    - **Practical AI.** Governed adoption that starts where it demonstrably helps, inside controls a regulator would recognise.
    - **People.** Growing architects and technical leaders, and an operating model that does not depend on any one of them, including me.

    Most of my best architecture work now happens in conversation rather than in an
    editor, which my younger, Jenkins-configuring self would have found deeply
    suspicious.
  result: >-
    This is the chapter I am still in, so here is an honest status rather than a
    victory lap. Fuller results belong in a future update, once they have happened.
  result_status:
    - status: In place
      text: Four teams and 22 people across European Architecture and the Chief Technology Office, supporting both European business lines.
    - status: In progress
      text: Architecture decision-making, engineering standards and architecture quality across the European business.
    - status: In progress
      text: Practical, governed AI enablement, and the technical-leadership capability to sustain it.
    - status: Direction
      text: European and global technology priorities shaped together rather than reconciled afterwards.
  learned: >-
    The unit of design keeps expanding. After applications, platforms and a company,
    the thing being designed is the environment in which other people's design
    decisions happen: decision rights, standards, governance, incentives and
    investment cases. The engineering habits still apply. Find the constraint,
    shorten the feedback loop, and prefer the thing people can run over the thing
    they must believe.
  reappeared: >-
    It is also where the research questions come from. How does an enterprise adopt
    agents without losing the coherence this role exists to protect? Hekton is where
    I test the parts of that question that can be tested on a home lab's budget.
  evidence:
    - label: Role detail, Head of Architecture & Chief Technology Office, Vanguard Europe
      url: /career/#vanguard-current
    - label: "Chapter five: Shaping the technology organisation"
      url: /journey/shaping-the-organisation/
  capabilities: [architecture, tech-strategy, org-design, governance-risk, ai-agentic, business-product]

- id: hekton-tekton
  slug: building-hekton-and-the-agentic-tekton
  title: The factory that built this website
  subtitle: Hekton, Gremlins and The Agentic Tekton
  chapter: agentic-enterprise
  environment: >-
    Evenings and weekends, a home lab, and a conviction: agentic AI will change how
    enterprises build software more than anything since the cloud, and the operating
    models do not exist yet.
  constraint: >-
    Executive roles produce opinions about AI faster than evidence. Most agentic
    thinking is either vendor demos or thought pieces written at a safe distance from
    a failing pipeline. Testing how agents really behave inside governed delivery
    requires building the whole system: agents, workflows, governance, cost controls
    and the software they produce.
  intervention: >-
    I built the system. Hekton is a private, experimental agentic software factory in
    which specialised agents research, design, build and review real software, with
    me approving what ships. Its governance is meant to be part of the workflow
    rather than paperwork around it: claims registers, decision logs, risk registers,
    agent review passes and human approval gates. Gremlins is the agent-first SDLC
    concept underneath, exploring tiered agent autonomy and where review gates should
    sit. The Agentic Tekton is where
    the patterns that survive get published: agentic operating models, invisible
    governance, AI FinOps, model routing across local and cloud models, context and
    dependency graphs, and human-agent team design.
  result: >-
    A small factory in regular use on a handful of real sites, including the one you
    are reading. Its review steps are working disciplines rather than an independent
    audit, and they do not catch everything, which is why a human still reads what
    ships. The writing at The Agentic Tekton grows from the same experiments.
  learned: >-
    The lessons of every earlier chapter apply to agents almost unchanged. Agents need
    platforms, enablement, governance and organisational design, the same things
    engineers needed. The difference is speed: an agentic organisation compounds
    capability faster than a human one, and its governance has to be built in from
    the first commit and still checked by someone who reads the output.
  reappeared: >-
    This is the chapter where the pattern points forward: the capability being built
    here is the one the next scale of role will need, designing enterprises where
    humans, platforms and agents are one system.
  evidence:
    - label: The Agentic Tekton
      url: https://theagentictekton.com
    - label: Gremlins
      url: https://gremlins.io
    - label: Coderturtle
      url: https://coderturtle.io
    - label: This site's build provenance
  capabilities: [ai-agentic, automation, governance-risk, org-design, platform-engineering]
