# "What I'm exploring now" — living section. Only link to destinations verified live
# (checked 2026-07-15): theagentictekton.com, gremlins.io, coderturtle.io.

intro: >-
  A connected research programme, run hands-on in a private lab, asking one question:
  how will technology organisations, software delivery and executive technology
  leadership change when intelligent agents become active participants in the
  enterprise?

items:
  - title: Agentic software factories
    body: >-
      Hekton is a private, experimental software factory where specialised agents
      research, design, build and review software for a handful of real sites, this
      one included, with a human approving what ships. It is the test bench for
      everything else on this list.

  - title: Invisible governance
    body: >-
      The hypothesis: governance works best as part of the delivery system rather
      than a stage after it. Hekton tests that with claims registers, decision logs,
      risk registers, agent review passes and human approval gates written into the
      workflow. Designed and exercised on real work; not yet something I would call
      an enforceable control at enterprise scale.

  - title: AI FinOps and model routing
    body: >-
      Cost-aware agent design: routing work between local and cloud models, matching
      model capability to task value, and making agent spend as observable as cloud
      spend.

  - title: Human-agent team design
    body: >-
      Operating models where agents are team members with tiered autonomy. Gremlins
      is the agent-first SDLC concept: which decisions agents could own, which humans
      should gate, and how that boundary might move as trust is earned.
    link:
      label: gremlins.io
      url: https://gremlins.io

  - title: Context and dependency graphs
    body: >-
      Agents are only as good as the context they can reach. Modelling organisations,
      codebases and decisions as connected graphs that both humans and agents can
      navigate.

  - title: Writing at The Agentic Tekton
    body: >-
      The public side of the programme: essays and patterns on agentic operating
      models, AI-era architecture and technology leadership, published as they survive
      contact with practice.
    link:
      label: theagentictekton.com
      url: https://theagentictekton.com

  - title: Long-running experiments at Coderturtle
    body: >-
      The workshop bench: sample architectures, tools and technical writing going
      back years, now increasingly built by the factory itself.
    link:
      label: coderturtle.io
      url: https://coderturtle.io
