# Career chapters. Each chapter follows the same narrative grammar:
# context -> constraint -> intervention -> outcome -> capability gained -> what this unlocked.
# Supporting evidence is maintained privately, outside this repository.

- id: automating-the-friction
  order: 1
  slug: automating-the-friction
  spine_label: Code
  era: "2006 – 2012"
  title: Automating the friction
  summary: >-
    Early roles at O2 and Fidelity, where a pattern emerged: find the manual work
    that slows a system down, and replace it with software.
  context: >-
    I started out where most engineers start, inside somebody else's process. At O2 I
    joined a network operations team that tracked Ireland's access-network routes in
    spreadsheets. At Fidelity I joined the graduate programme and landed in fixed-income
    technology, surrounded by research analysts assembling reports by hand and
    developers losing days to environment setup.
  constraint: >-
    In every one of these teams the constraint was the same: skilled people spending
    most of their time on repetitive, error-prone manual work. The systems worked, but
    only because humans kept feeding them.
  intervention: >-
    I kept writing the tool nobody had asked for. Scripts that migrated thousands of
    network routes from spreadsheets into O2's new record system. A one-click installer
    that turned days of development-environment setup into minutes. A reporting tool
    that consolidated data across systems so analysts could build research reports
    directly. A Ruby on Rails support app that packaged common fixes so first-line
    support could resolve them without escalating.
  outcomes:
    - Network-route migration automated, cutting data-entry errors in the move to the new system.
    - Research reports that took up to a week could be produced in minutes.
    - Common support issues moved from engineers to L1 support.
    - Dev-environment setup became a one-click install.
  capability_gained: >-
    The instinct that shaped everything after: understand the system, find the
    constraint, and automate the friction. Also the craft basics: shipping production
    software in Java, C#, Ruby and JavaScript inside a regulated firm.
  unlocked: >-
    Once you have automated the friction inside one team, you start noticing the same
    friction in every team. The obvious next question was whether one piece of software
    could remove a constraint for many teams at once. That question led to platforms.
  next: reusable-foundations
  capabilities: [automation, architecture]
  roles: [o2-intern, fidelity-ireland-ase, fimt-se]

- id: reusable-foundations
  order: 2
  slug: reusable-foundations
  spine_label: Platforms
  era: "2012 – 2016"
  title: Building reusable foundations
  summary: >-
    The XTRAC years, where the work shifted from delivering single applications to
    building the platform that let many applications exist.
  context: >-
    I moved to XTRAC, Fidelity's workflow business, first as a senior engineer on the
    labs team and then as principal architect. The labs remit was explicit: run 8 to 12
    week proofs of concept and find the investments that would carry the business
    forward. Roughly one in five got funded.
  constraint: >-
    The business wanted to digitise paper-based services, but every project was
    building its own plumbing from scratch. Integration, forms handling, environments
    and releases were re-solved on every project, so each digitisation effort cost as
    much as the last one.
  intervention: >-
    I designed and built XTRAC Connect, a Java integration engine running natively on
    AWS, as a building block for the digitisation strategy, and defined a forms
    continuum on top of it so paper forms could be converted into digital journeys
    repeatably. I automated environment creation with CloudFormation, Ruby and Jenkins
    until a single person could operate the platform. As principal architect I
    re-architected the Fidsafe file-sharing platform for a thousand-fold scale increase
    and led the migration of a Java/Spring monolith to serverless Node.js services on
    API Gateway, Lambda and SQS.
  outcomes:
    - XTRAC Connect became the foundation for the digitisation-of-services strategy.
    - A 28-page pensions PDF became a digital journey, cutting processing from over a week to under a day.
    - Fidsafe was redesigned to support 10 million+ users cost-effectively, with CD pipelines that took releases from monthly to daily; costs fell by over 400k in its first year.
    - Environment provisioning was fully automated; one engineer could run the platform.
  capability_gained: >-
    Platform thinking. The unit of work stopped being the application and became the
    capability underneath it: the integration engine, the pipeline, the reusable
    infrastructure. And cloud-native architecture as a first language rather than a
    migration target.
  unlocked: >-
    Platforms multiply what teams can build, but only if teams know how to use them.
    The next constraint was not technical at all. It was how fast an organisation of
    engineers could learn a new way of building.
  next: scaling-capability
  capabilities: [automation, platform-engineering, architecture, governance-risk, business-product]
  roles: [xtrac-se, xtrac-principal]

- id: scaling-capability
  order: 3
  slug: scaling-capability
  spine_label: Engineering capability
  era: "2016 – 2020"
  title: Scaling cloud and engineering capability
  summary: >-
    Two director-of-architecture roles at Fidelity, where the job changed from
    designing systems to designing how the organisation builds systems.
  context: >-
    As Director of Software Architecture for Fidelity's APS division, and later
    Director of Architecture in Personal Investing, I inherited organisations at the
    start of their cloud journey: tentative AWS experiments, deep on-prem habits, and a
    digital transformation strategy that assumed engineering capability the org did not
    yet have.
  constraint: >-
    Cloud adoption was gated on people, not technology. A strategy document does not
    teach an engineer to think in events, infrastructure as code or serverless
    economics. Every new project paid the same learning tax again.
  intervention: >-
    I treated capability itself as the system to build. Tentative AWS experiments
    were turned into a multi-year cloud strategy with live cloud-native applications
    behind it, on infrastructure-as-code patterns that let later projects start from
    a working foundation instead of a blank page. I created live-coding workshops
    across serverless, Alexa and machine learning, then in Personal Investing scaled
    the idea into a developer learning dojo: self-contained, cross-platform katas
    covering full solution development, pipelines included, upskilling teams
    concurrently across global locations. My team of fifteen built the cloud-native
    event-driven platform underneath the digital experience ecosystem, with its
    domain boundaries defined in Event Storming and domain-driven design sessions I
    ran with the business. As tech owner of the labs group I also kept a hand in
    experiments and MVPs, including early distributed-ledger work.
  outcomes:
    - Tentative cloud experiments became a funded multi-year cloud strategy with multiple live cloud-native applications.
    - The learning dojo and cloud centre of excellence were adopted by multiple teams across global sites.
    - Reusable infrastructure patterns cut the time and cost of every subsequent project.
    - Labs MVPs were evaluated fast enough that roughly one in five proofs of concept earned funding, with six-figure savings per funded project.
    - An event-driven platform became the backbone of the digital experience ecosystem.
  capability_gained: >-
    Developer enablement as a discipline: dojos, katas, reference architectures,
    centres of excellence. And the realisation that architecture is a teaching job as
    much as a design job.
  unlocked: >-
    I had scaled engineering capability inside a large firm, on top of platforms,
    security and funding that already existed. The test I had not taken was building
    all of it from nothing. A startup asked exactly that.
  next: building-companies
  capabilities: [automation, platform-engineering, architecture, developer-enablement, org-design, tech-strategy, business-product, ai-agentic]
  roles: [aps-director, pi-director]

- id: building-companies
  order: 4
  slug: building-companies
  spine_label: Organisations
  era: "2021 – 2024"
  title: Building platforms, teams and companies
  summary: >-
    HUB, joined as the founding technologist alongside the CTO and eighth employee.
    Architecture, engineering, hiring, security, operations and company building
    converged in one role.
  context: >-
    HUB was a fintech with a product vision, a CTO, and almost nothing else technical:
    no platform, no engineering organisation, no security posture, no hiring pipeline.
    I joined in January 2021 as the first technical hire alongside the CTO and the
    company's eighth employee.
  constraint: >-
    Everything was the constraint, and everything competed for the same small team's
    attention. The company needed a product for regulated financial-services clients,
    the platform to run it on, the engineers to build it, and the controls to make it
    trustworthy, all at once, with a startup's budget and clock.
  intervention: >-
    I built the technical foundations and the organisation in the same motion. On the
    platform side, the foundational architecture on Azure with fully automated
    environments built from ARM, Bicep and Terraform through Azure DevOps pipelines,
    plus the initial security and infosec posture with SOC monitoring. On the
    organisation side, the resource plans, hiring process and autonomous team
    structures, along with the tech radar, architecture principles and development
    standards that kept a fast-growing group coherent. As the company scaled I became
    Managing Director and Head of Cloud Engineering in May 2022, owning the strategic
    technology and cloud roadmap, partnering
    with product, compliance and executive leadership, standing up an Engineering
    Enablement Platform and centre-of-excellence model, leading SOC 2 Type I
    readiness, and introducing event-driven automation and infrastructure-as-code as
    default practice. Towards the end of my time there we were exploring Azure OpenAI
    and retrieval-augmented generation workflows for the product.
  outcomes:
    - The engineering organisation grew from one technologist to 60+ engineers across Ireland, the UK and India, inside a company that grew to roughly 70 people.
    - Cloud running costs reduced by approximately 40 percent.
    - Environment provisioning approximately 80 percent faster, with environments automated from the first commit so a new one was a pipeline run rather than a project.
    - Led the SOC 2 Type I readiness programme that gave regulated clients the assurance evidence they needed.
    - Client-facing MVPs designed with clients and subject-matter experts and delivered by the teams the process had hired.
  capability_gained: >-
    The bridge from architect to technology executive. Organisational design, hiring,
    budgets, compliance, client relationships and board-level trade-offs stopped being
    adjacent concerns and became the job. Company building is system design with
    people in the loop.
  unlocked: >-
    Having built a technology organisation from nothing, the next scale up was
    steering one that already exists inside a global firm, where the hard problems are
    strategy, governance and alignment rather than greenfield construction.
  next: shaping-the-organisation
  capabilities: [automation, platform-engineering, architecture, developer-enablement, org-design, governance-risk, business-product, tech-strategy, ai-agentic]
  roles: [hub-director]

- id: shaping-the-organisation
  order: 5
  slug: shaping-the-organisation
  spine_label: Technology strategy
  era: "Since 2024"
  title: Shaping the technology organisation
  summary: >-
    Vanguard Europe, leading architecture and the Chief Technology Office. The unit of
    design is now the environment in which business priorities, platforms, teams and
    investment decisions come together.
  context: >-
    Vanguard's European business spans UK Personal Investing and European Financial
    Adviser Services: regulated locally, and built on the platforms and technology
    organisation of a global firm. I joined in October 2024 as Head of Architecture.
    Today I lead European Architecture and the Chief Technology Office, four teams
    and 22 people,
    working closely with the European CIO, business and product leadership, and
    Vanguard's global technology organisation.
  constraint: >-
    At this scale the binding constraint is rarely a missing technology. It is
    coherence. European business priorities, global platform roadmaps, architecture
    standards, engineering practice and governance all move at once, each sensible on
    its own terms and not always in the same direction. In a regulated business,
    every gap between strategy and execution is a risk as well as a cost.
  intervention: >-
    The work is connective rather than commanding. I do not own Vanguard's global
    platforms or its investment decisions. My job is to make sure European priorities
    arrive at those decisions well formed, and that what comes back can be executed.
    That means setting architecture direction and engineering standards for the
    European business; improving how architecture decisions get made, so they are
    explicit, recorded and revisitable; balancing team autonomy against enterprise
    consistency with governance a delivery team can act on without a meeting;
    building architecture and platform-engineering capability in the team; and making
    AI adoption practical and governed rather than performative.
  outcomes_label: Where it stands
  outcomes:
    - status: In place
      text: Four teams and 22 people across European Architecture and the Chief Technology Office, supporting UK Personal Investing and European Financial Adviser Services.
    - status: In progress
      text: Architecture quality, engineering standards and architecture decision-making across both European business lines.
    - status: In progress
      text: Practical, governed AI enablement in a regulated environment.
    - status: In progress
      text: Developing technical leaders and the organisational capability around them.
    - status: Direction
      text: European priorities and global platform strategy shaped together, rather than reconciled afterwards.
  outcomes_note: >-
    This is the chapter I am still in, so it reports scope and direction rather than
    results. Results get written up once they have happened, ideally with numbers.
  capability_gained: >-
    Technology leadership at organisational scale: operating-model design, influencing
    investment without owning it, and making governance something teams use rather
    than something done to them.
  unlocked: >-
    Working at this altitude makes the next shift visible early. Intelligent agents
    are starting to take part in how enterprises build and run technology, and
    somebody has to design what that organisation looks like.
  next: agentic-enterprise
  capabilities: [platform-engineering, architecture, tech-strategy, org-design, governance-risk, ai-agentic, business-product]
  roles: [vanguard-current]

- id: agentic-enterprise
  order: 6
  slug: agentic-enterprise
  spine_label: Agentic enterprise
  era: "Now"
  title: Designing the agentic enterprise
  summary: >-
    A connected research programme, built hands-on outside the day job, exploring how
    organisations, software delivery and technology leadership change when intelligent
    agents become active participants in the enterprise.
  context: >-
    Every previous chapter automated friction at one scale and then met the same
    friction one level up. Agentic AI is the first technology that can operate at all
    of those levels at once: writing the code, running the pipeline, applying the
    governance, even proposing the roadmap. That raises a question worth a research
    programme rather than a hot take.
  constraint: >-
    Enterprises cannot adopt agents by bolting a chatbot onto the existing operating
    model. The constraints are structural: how work is decomposed, how governance is
    enforced, how cost is controlled, and how human and agent teams share
    responsibility. Nobody has a proven design yet, including me.
  intervention: >-
    I am exploring it empirically, as a connected body of work. Hekton is an
    experimental agentic software factory: a private lab where specialised agents
    research, design, build and review real software, this site included, with a
    human (me) approving what ships. Its governance is written into the workflow as
    code and records: claims registers, decision logs, risk registers, agent review
    passes and approval gates. Gremlins is the agent-first SDLC concept underneath it,
    exploring tiered autonomy and where review gates should sit.
    The Agentic Tekton is the public thought-leadership platform where the patterns
    that survive contact with practice get written up: agentic operating models,
    invisible governance, AI FinOps, local and cloud model routing, context and
    dependency graphs, and human-agent team design.
  outcomes_label: What exists so far
  outcomes:
    - status: Demonstrated
      text: This website was researched, designed, built and reviewed by agents in Hekton, with every production release approved by me.
    - status: Demonstrated
      text: A small multi-project factory in regular use on a handful of real sites, with agent review passes and human approval gates exercised on real changes.
    - status: Experimental
      text: Governance-as-code, tiered autonomy and automated review. Designed, documented and exercised; not independently audited, and not proven as enforceable controls. An agent reviewing an agent is useful. It is not assurance.
    - status: Ongoing
      text: Public writing at The Agentic Tekton connecting agentic delivery to enterprise operating models.
    - status: Open question
      text: Whether any of this transfers to an enterprise operating model at scale. That is the research question, not a result.
  capability_gained: >-
    First-hand, current, hands-on knowledge of what agentic delivery actually breaks
    and what it makes possible, including how often it needs a human to read the
    output. The executive perspective and the practitioner
    perspective on the same frontier, at the same time.
  unlocked: >-
    This chapter is still being written. The pattern says the capability being built
    here gets applied at the next scale up: the enterprise that designs humans,
    platforms and agents as one system.
  next: null
  capabilities: [automation, platform-engineering, architecture, developer-enablement, org-design, tech-strategy, governance-risk, ai-agentic]
  roles: []
