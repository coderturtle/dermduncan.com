risk_register_version: 1
project_name: dermduncan.com
created_date: 2026-07-15

risks:
  - id: RISK-0001
    title: "No .gitignore; built public/ output and .DS_Store files are tracked"
    category: repository-hygiene
    likelihood: high
    impact: low
    status: open
    owner: hekton
    mitigation: "Add a .gitignore (public/, .DS_Store, resources/) and untrack all 10 already-committed .DS_Store files (root, content/, docs/, old/, old/docs/, public/, public/img/, static/, static/img/, themes/) plus public/ in a dedicated hygiene commit after adoption, not inside it."
    raised_date: 2026-07-15
    reviewed_date: 2026-07-15
    links:
      - "docs/adoption-audit.md"
      - "docs/risks.md"
  - id: RISK-0002
    title: "Personal contact details are committed in config.toml"
    category: personal-data
    likelihood: high
    impact: low
    status: accepted
    owner: hekton
    mitigation: "Email, phone, and address in config.toml are intentional, already-public CV content on the live site. No action required; re-confirm with the owner before adding further personal data during any future content change."
    raised_date: 2026-07-15
    reviewed_date: 2026-07-15
    links:
      - "config.toml"
      - "docs/adoption-audit.md"
  - id: RISK-0003
    title: "Hugo version and theme provenance are not documented in-repo"
    category: reproducibility
    likelihood: medium
    impact: low
    status: open
    owner: hekton
    mitigation: "Hugo 0.123.7 (extended edition) is pinned via the HUGO_VERSION GitHub Actions repository variable, not enforced locally: docs/setup.md's `brew install hugo` doesn't specify extended, and scripts/check-prereqs.sh only checks that some hugo binary exists, not its version/edition. themes/hugo-resume is vendored directly (no .gitmodules) with no recorded upstream version/commit. Document both in docs/local-assumptions.md; consider recording the vendored theme's upstream source and adding an extended-edition check to check-prereqs.sh in a follow-up."
    raised_date: 2026-07-15
    reviewed_date: 2026-07-15
    links:
      - "docs/local-assumptions.md"
      - "themes/hugo-resume"
  - id: RISK-0004
    title: "Deploy workflow depends on undocumented GitHub Actions repository variables"
    category: deployment
    likelihood: medium
    impact: medium
    status: open
    owner: hekton
    mitigation: "AWS_REGION, BUCKET_NAME, CF_DISTRIBUTION_ID, HUGO_VERSION, ROLE_TO_ASSUME, SITE_BASE_URL, and CODE_SESSION_NAME are set as repo variables in GitHub, not in-repo. Variable *names* are documented in docs/reproducibility.md so a blank-machine rebuild knows what must be configured out-of-band. Current *values* were read via `gh variable list` (read-only, not a secret-store operation) but were deliberately not committed anywhere in this public repo — the IAM role ARN and CloudFront distribution ID are more exposed sitting in tracked docs than in GitHub's variables UI, which requires write access to view even on a public repo. See docs/decisions.md."
    raised_date: 2026-07-15
    reviewed_date: 2026-07-15
    links:
      - ".github/workflows/main.yml"
      - "docs/reproducibility.md"
      - "docs/decisions.md"
  - id: RISK-0005
    title: "Certification PDF links are broken on the live production site"
    category: production-defect
    likelihood: high
    impact: low
    status: open
    owner: hekton
    mitigation: "content/projects/contributions/*.md (7 files) link to /docs/*.pdf, but docs/ is a plain repo directory (not under static/), so Hugo never copies those PDFs into the deployed public/ output and the S3 sync only uploads ./public/. Verified live 2026-07-15: homepage returns 200, all 7 /docs/*.pdf links return 404. Pre-existing, not introduced by adoption; left unfixed per the no-refactor-during-adoption rule. Fix in a follow-up by moving the PDFs under static/docs/ (or equivalent) so Hugo includes them in the build."
    raised_date: 2026-07-15
    reviewed_date: 2026-07-15
    links:
      - "content/projects/contributions/"
      - "docs/risks.md"
