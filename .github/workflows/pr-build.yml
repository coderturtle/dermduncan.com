# Pull-request build check. Builds with the same Hugo version, edition, flags and
# environment as the production deploy (main.yml), then runs the link and
# public-boundary checks. It never deploys and needs no secrets.
name: PR build check

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Same source as production; falls back to the documented production pin.
      HUGO_VERSION: ${{ vars.HUGO_VERSION || '0.123.7' }}
    steps:
      - name: Install Hugo CLI (extended, production version)
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
          hugo version
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Build with Hugo (production flags)
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ vars.SITE_BASE_URL || 'https://dermduncan.com' }}/"
      - name: Check links, assets and anchors
        run: python3 scripts/check-links.py public "${{ vars.SITE_BASE_URL || 'https://dermduncan.com' }}"
      - name: Check public/private boundary
        run: scripts/check-public-boundary.sh
      - name: Test the deploy upload script (no AWS credentials, no network)
        run: bash scripts/test-deploy-site.sh
