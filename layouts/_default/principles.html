{{ define "main" }}
<section class="page-head">
  <div class="section-inner">
    <h1>Leadership principles</h1>
    <div class="page-lede">{{ .Content }}</div>
  </div>
</section>
<section class="principles">
  <div class="section-inner">
    <ol class="principle-list">
      {{- range .Site.Data.career.principles }}
      <li class="principle">
        <div class="principle-body">
          <h2>{{ .title }}</h2>
          <p>{{ .body }}</p>
        </div>
      </li>
      {{- end }}
    </ol>
    <blockquote class="signature-quote">
      <p>Perfection is a road, not a destination.</p>
    </blockquote>
  </div>
</section>
{{ end }}
